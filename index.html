    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --ink: #12233F;       /* deep institutional navy */
            --ink-soft: #223759;
            --paper: #FBF7EC;     /* warm parchment */
            --paper-deep: #F2EBD9;
            --verdigris: #3E7C6B; /* signature accent — patinated copper/justice green */
            --verdigris-dark: #2C5B4E;
            --brass: #B08D3E;     /* stamped seal gold */
            --terracotta: #B0432E; /* alert / urgent */
            --charcoal: #1D2430;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-color: var(--paper);
            color: var(--charcoal);
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .serif-text { font-family: 'Fraunces', serif; }
        .mono-text { font-family: 'JetBrains Mono', monospace; }

        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        @media (prefers-reduced-motion: reduce) {
            .fade-in { animation: none; opacity: 1; }
            * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
        }

        /* Case-file card styling */
        .file-card {
            background: #ffffff;
            border: 1px solid rgba(18,35,63,0.12);
            border-radius: 4px;
            position: relative;
            transition: all 0.25s ease-in-out;
        }
        .file-card:hover {
            box-shadow: 0 18px 38px -18px rgba(18,35,63,0.35);
            border-color: rgba(18,35,63,0.22);
            transform: translateY(-3px);
        }

        .paper-grain {
            background-image:
                repeating-linear-gradient(0deg, rgba(18,35,63,0.025) 0px, rgba(18,35,63,0.025) 1px, transparent 1px, transparent 3px);
        }

        ::selection { background: var(--verdigris); color: #fff; }

        .focus-ring:focus-visible {
            outline: 2px solid var(--verdigris);
            outline-offset: 2px;
        }

        .btn-primary {
            background: var(--verdigris);
            color: #fff;
        }
        .btn-primary:hover { background: var(--verdigris-dark); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

        .divider-stamp {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .divider-stamp::before, .divider-stamp::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(18,35,63,0.15);
        }

        .scroll-reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .scroll-reveal.is-visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Form Custom Input Styles */
        .minimal-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid #E2E8F0;
            padding: 0.75rem 0;
            font-size: 1.05rem;
            color: var(--ink);
            transition: border-color 0.3s ease;
        }
        .minimal-input:focus {
            outline: none;
            border-bottom-color: var(--verdigris);
        }
        .minimal-input::placeholder { color: #A0AEC0; }
        .minimal-input.field-error { border-bottom-color: var(--terracotta); }

        /* Honeypot — hidden from real users, visible to bots that auto-fill everything */
        .hp-field {
            position: absolute;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }

        /* Hero Bird Animation */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .hero-bird {
            animation: float 6s ease-in-out infinite;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.2));
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    </style>

            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const obs = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) { setVisible(true); obs.disconnect(); }
                }, { threshold: 0.15 });
                if (ref.current) obs.observe(ref.current);
                return () => obs.disconnect();
            }, []);
            return <div ref={ref} className={`scroll-reveal ${visible ? 'is-visible' : ''} ${className}`}>{children}</div>;

            const [errorMsg, setErrorMsg] = useState('');
            const [ticketId] = useState(() => `OP-${Math.floor(Math.random() * 90000) + 10000}`);
            const formRef = useRef(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                const form = e.target;

                // Honeypot check — if this hidden field got filled, silently drop (likely a bot)
                if (form._gotcha && form._gotcha.value) {
                    setStatus('success');
                    return;
                }

                setStatus('submitting');
                setErrorMsg('');

                const formData = new FormData(form);
                // Friendlier subject line in your inbox
                formData.set('_subject', `OpenPath Intake: ${formData.get('issue') || 'New Request'} — ${formData.get('name') || 'Unknown'}`);
                formData.set('ticket_id', ticketId);

                try {
                    const response = await fetch(FORMSPREE_ENDPOINT, {
                        method: 'POST',
                        headers: { 'Accept': 'application/json' },
                        body: formData
                    });

                    if (response.ok) {
                        setStatus('success');
                        form.reset();
                    } else {
                        const data = await response.json().catch(() => null);
                        const msg = data && data.errors && data.errors.length
                            ? data.errors.map(er => er.message).join(', ')
                            : `Server responded with status ${response.status}`;
                        setErrorMsg(msg);
                        setStatus('error');
                    }
                } catch (err) {
                    setErrorMsg(err.message || 'Network error');
                    setStatus('error');
                }

                            </div>

                                            </button>

                        ))}
                    </div>
                </div>
            </div>
        );

        const About = ({ t }) => (
            <div className="fade-in min-h-screen relative" style={{background: 'var(--paper)'}}>
                <PageHeader title={t.about.title} subtitle={t.about.mission} refCode="ABOUT // OPENPATH" />

                <div className="py-16 max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                    <h2 className="text-2xl font-bold mb-8 serif-text" style={{color: 'var(--ink)'}}>{t.about.valuesTitle}</h2>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                        {t.about.values.map((val, idx) => (
                            <div key={idx} className="rounded-sm p-4 text-center shadow-sm" style={{background: '#fff', border: '1px solid rgba(18,35,63,0.12)'}}>
                                <span className="font-semibold text-sm" style={{color: 'var(--ink)'}}>{val}</span>
                            </div>
                        ))}
                    </div>
                </div>

                <div className="py-8 relative z-10">
                    <div className="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div className="file-card p-8" style={{borderTop: '3px solid var(--verdigris)'}}>
                                <h3 className="text-xl font-bold mb-4 serif-text" style={{color: 'var(--ink)'}}>{t.about.ourStoryTitle}</h3>
                                <p className="text-sm leading-relaxed" style={{color: '#4B5568'}}>{t.about.ourStory}</p>
                            </div>
                            <div className="file-card p-8" style={{borderTop: '3px solid var(--ink)'}}>
                                <h3 className="text-xl font-bold mb-4 serif-text" style={{color: 'var(--ink)'}}>{t.about.visionTitle}</h3>
                                <p className="text-sm leading-relaxed mb-6" style={{color: '#4B5568'}}>{t.about.vision}</p>

                                <h3 className="text-xl font-bold mb-4 serif-text" style={{color: 'var(--ink)'}}>{t.about.methodologyTitle}</h3>
                                <p className="text-sm leading-relaxed" style={{color: '#4B5568'}}>{t.about.methodology}</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div className="py-16 mb-12 relative z-10">
                    <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="file-card p-8 md:p-12 relative bg-white" style={{borderTop: '6px solid var(--brass)'}}>
                            <div className="mb-10 border-b pb-6 text-center" style={{borderColor: 'rgba(18,35,63,0.12)'}}>
                                <span className="inline-block px-3 py-1 text-xs font-bold uppercase rounded-sm mb-4 tracking-wider mono-text" style={{background: 'var(--paper-deep)', color: '#4B5568'}}>
                                    {t.about.founderTitle}
                                </span>
                                <h3 className="text-3xl font-bold mb-2 serif-text" style={{color: 'var(--ink)'}}>{t.about.founderName}</h3>
                                <p className="font-medium text-sm" style={{color: 'var(--verdigris)'}}>{t.about.founderRole}</p>
                            </div>

                            <div className="space-y-8 text-sm leading-relaxed" style={{color: '#3A4256'}}>
                                <div>
                                    <h4 className="font-bold mb-2" style={{color: 'var(--ink)'}}>{t.about.founderEduTitle}</h4>
                                    <p>{t.about.founderEdu}</p>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-2" style={{color: 'var(--ink)'}}>{t.about.founderExpTitle}</h4>
                                    <p>{t.about.founderExp}</p>
                                </div>
                                <div>
                                    <h4 className="font-bold mb-2" style={{color: 'var(--ink)'}}>{t.about.founderAwardsTitle}</h4>
                                    <p>{t.about.founderAwards}</p>
                                </div>

                                <div className="pt-6 mt-6 border-t p-6 rounded-sm" style={{borderColor: 'rgba(18,35,63,0.12)', background: 'var(--paper-deep)'}}>
                                    <p className="font-medium italic text-center serif-text" style={{color: 'var(--ink)'}}>
                                        {t.about.founderQuote}
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Support = ({ t }) => (
            <div className="min-h-screen fade-in relative" style={{background: 'var(--paper)'}}>
                <PageHeader title={t.support.title} subtitle={t.support.subtitle} refCode="SUPPORT // CONTRIBUTE" />
                <div className="py-16 px-4 relative z-10">
                    <div className="max-w-2xl mx-auto text-center">
                        <button className="btn-primary font-semibold py-3 px-10 rounded-sm shadow-sm transition-colors text-sm mb-16 focus-ring">
                            {t.support.donateBtn}
                        </button>

                        <div className="file-card p-8 text-left" style={{borderTop: '3px solid var(--brass)'}}>
                            <h3 className="text-lg font-bold mb-6 border-b pb-4 serif-text" style={{color: 'var(--ink)', borderColor: 'rgba(18,35,63,0.12)'}}>{t.support.contact}</h3>
                            <div className="space-y-4 text-sm">
                                <div className="flex justify-between items-center p-3 rounded-sm" style={{background: 'var(--paper-deep)'}}>
                                    <span className="font-medium" style={{color: '#6B7385'}}>Email</span>
                                    <a href={`mailto:${t.support.email}`} className="font-semibold mono-text hover:underline" style={{color: 'var(--verdigris)'}}>{t.support.email}</a>
                                </div>
                                <div className="flex justify-between items-center p-3 rounded-sm" style={{background: 'var(--paper-deep)'}}>
                                    <span className="font-medium" style={{color: '#6B7385'}}>Phone</span>
                                    <a href={`tel:${t.support.phone.replace(/[^+\d]/g, '')}`} className="font-semibold mono-text hover:underline" style={{color: 'var(--ink)'}}>{t.support.phone}</a>
                                </div>
                                <div className="flex justify-between items-center p-3 rounded-sm" style={{background: 'var(--paper-deep)'}}>
                                    <span className="font-medium" style={{color: '#6B7385'}}>Location</span>
                                    <span className="font-semibold" style={{color: 'var(--ink)'}}>{t.support.address}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Footer = ({ t, setView }) => (
            <footer className="py-12 border-t" style={{background: 'var(--ink)', borderColor: 'rgba(255,255,255,0.1)'}}>
                <div className="max-w-[85rem] mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 pb-8 border-b gap-4" style={{borderColor: 'rgba(255,255,255,0.1)'}}>
                        <div className="flex items-center">
                            <span className="text-white font-bold text-xl block leading-none serif-text">OpenPath International</span>
                        </div>
                        <div className="flex items-center gap-4">
                            <button onClick={() => setView('support')} className="text-xs text-white/60 hover:text-white transition-colors uppercase tracking-widest">
                                {t.nav.support}
                            </button>
                            <a href={`mailto:${t.support.email}`} className="text-xs mono-text tracking-widest text-white/50 hover:text-white/80 uppercase transition-colors">
                                {t.support.email}
                            </a>
                        </div>
                    </div>
                    <div className="text-xs text-white/50 leading-relaxed max-w-4xl">
                        <p className="font-semibold text-white/80 mb-2 uppercase tracking-widest">Disclaimer</p>
                        <p>{t.disclaimer}</p>
                        <p className="mt-6">© {new Date().getFullYear()} OpenPath International. Non-Governmental Organization.</p>
                    </div>
                </div>
            </footer>
        );

        const App = () => {
            const [currentView, setView] = useState('home');
            const [lang, setLang] = useState('en');
            const t = content[lang];

            useEffect(() => { window.scrollTo(0, 0); }, [currentView]);

            const renderView = () => {
                switch(currentView) {
                    case 'home': return <Home setView={setView} t={t} />;
                    case 'news': return <ContentList data={t.newsData} setView={setView} t={t} />;
                    case 'getHelp': return <GetHelp t={t} />;
                    case 'legal': return <CategoryDashboard data={t.legalHub} setView={setView} t={t} />;
                    case 'directories': return <CategoryDashboard data={t.directoryHub} setView={setView} t={t} />;
                    case 'essentialRights': return <ContentList data={t.essentialRights} backTarget="legal" setView={setView} t={t} />;
                    case 'guides': return <ContentList data={t.guidesData} backTarget="legal" setView={setView} t={t} />;
                    case 'conventions': return <ContentList data={t.conventionsData} backTarget="legal" setView={setView} t={t} />;
                    case 'visas': return <ContentList data={t.visaData} backTarget="legal" setView={setView} t={t} />;
                    case 'institutions': return <ContentList data={t.institutionsData} backTarget="directories" setView={setView} t={t} />;
                    case 'embassies': return <ContentList data={t.embassiesData} backTarget="directories" setView={setView} t={t} />;
                    case 'about': return <About t={t} />;
                    case 'support': return <Support t={t} />;
                    default: return <Home setView={setView} t={t} />;
                }
            };

            return (
                <div className="min-h-screen flex flex-col font-sans" style={{background: 'var(--paper)', color: 'var(--charcoal)'}}>
                    <Navbar currentView={currentView} setView={setView} lang={lang} setLang={setLang} t={t} />
                    <main className="flex-grow relative z-10">
                        {renderView()}
                    </main>
                    <Footer t={t} setView={setView} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
